<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    #diagram { padding: 16px; }
    #diagram svg { max-width: none !important; height: auto; }
  </style>
  <script src="mermaid.min.js"></script>
</head>
<body>
  <div id="diagram"></div>
  <script>
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'default' });
    window.renderDiagram = function (text) {
      var lastText = text;
      var el = document.getElementById('diagram');
      function draw() {
        el.innerHTML = '';
        var id = 'd' + Date.now();
        mermaid.render(id, lastText)
          .then(function (res) { el.innerHTML = res.svg; })
          .catch(function (e) {
            el.innerHTML = '<pre style="color:#b00020;white-space:pre-wrap;font-size:14px">' + String(e) + '</pre>';
            var retry = document.createElement('button');
            retry.textContent = '再描画';
            retry.style.marginTop = '12px';
            retry.addEventListener('click', draw);
            el.appendChild(retry);
          });
      }
      draw();
    };
  </script>
</body>
</html>
